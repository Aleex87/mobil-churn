name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      data_file:
        description: "CSV file to validate"
        required: true
        default: "kundbas.csv"
        type: choice
        options:
          - kundbas.csv
          - kundbas_ny_leverans.csv

jobs:
  datakontroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -e ".[data]"

      - name: Validate customer data
        env:
          DATA_FILE: ${{ inputs.data_file || 'kundbas.csv' }}
        run: python kontroller/schema.py "data/$DATA_FILE"
  allt:
    needs: datakontroll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -e ".[dev]"

      - run: pytest

      - run: python -m churn.model
      - run: python -m churn.evaluate